<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="title description">
<title id="title">Agent Context Bench workflow</title>
<desc id="description">Agent context files enter a local static audit without LLM or API calls. The optional candidate can then be measured by a benchmark that invokes the user's agent CLI.</desc>
<rect x="0.5" y="0.5" width="879" height="287" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="32" y="50" font-size="10.5" fill="#676661" letter-spacing="0.06em">AGENT CONTEXT FILES</text>
<rect x="32" y="64" width="200" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
<text x="48" y="83.5" font-size="12" fill="#52514e">AGENTS.md</text>
<rect x="32" y="102" width="200" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
<text x="48" y="121.5" font-size="12" fill="#52514e">CLAUDE.md</text>
<rect x="32" y="140" width="200" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
<text x="48" y="159.5" font-size="12" fill="#52514e">SKILL.md files</text>
<rect x="32" y="178" width="200" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
<text x="48" y="197.5" font-size="12" fill="#52514e">.cursor/rules</text>
<rect x="32" y="216" width="200" height="30" rx="6" fill="#f0efec" stroke="#e1e0d9"/>
<text x="48" y="235.5" font-size="12" fill="#52514e">copilot-instructions.md</text>
<rect x="296" y="64" width="236" height="150" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="316" y="88" font-size="10.5" fill="#1f64b7" font-weight="700" letter-spacing="0.05em">STATIC AUDIT</text>
<text x="316" y="112" font-size="13.5" fill="#0b0b0b" font-weight="600">Local · no LLM/API calls</text>
<text x="316" y="139" font-size="11.5" fill="#52514e">heuristic scores 0–100 by scope</text>
<text x="316" y="160" font-size="11.5" fill="#52514e">flags bloat, conflicts &amp; broken refs</text>
<text x="316" y="181" font-size="11.5" fill="#52514e">--write-optimized: review candidate</text>
<rect x="596" y="64" width="252" height="150" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="616" y="88" font-size="10.5" fill="#1f64b7" font-weight="700" letter-spacing="0.05em">MEASURED COMPARISON · RUN-BENCH</text>
<text x="616" y="112" font-size="13.5" fill="#0b0b0b" font-weight="600">Invokes your agent CLI</text>
<text x="616" y="139" font-size="11.5" fill="#52514e">none / current / generated candidate</text>
<text x="616" y="160" font-size="11.5" fill="#52514e">success: agent + verifier exit 0</text>
<text x="616" y="181" font-size="11.5" fill="#52514e">duration, context tokens &amp; file metrics</text>
<line x1="240" y1="139" x2="288" y2="139" stroke="#73726d" stroke-width="1.5"/>
<path d="M288 134.5 L296 139 L288 143.5 z" fill="#73726d"/>
<line x1="540" y1="139" x2="588" y2="139" stroke="#73726d" stroke-width="1.5"/>
<path d="M588 134.5 L596 139 L588 143.5 z" fill="#73726d"/>
<text x="568" y="128" font-size="10.5" fill="#676661" text-anchor="middle">generated</text>
<text x="568" y="156" font-size="10.5" fill="#676661" text-anchor="middle">candidate</text>
<text x="32" y="266" font-size="11" fill="#676661">Static audit stays local. run-bench invokes your agent CLI and may incur provider costs.</text>
</svg>
