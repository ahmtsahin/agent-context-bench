<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title description">
  <title id="title">Agent Context Bench</title>
  <desc id="description">A linter and measured A/B benchmark for coding-agent context files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#102d4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="10%" r="70%">
      <stop offset="0" stop-color="#2d81ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2d81ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cde2ff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000814" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(72 62)">
      <rect width="226" height="34" rx="17" fill="#153158" stroke="#3e80d6" stroke-opacity=".7"/>
      <circle cx="19" cy="17" r="5" fill="#55d6be"/>
      <text x="34" y="22" font-size="13" font-weight="700" letter-spacing="1.1" fill="#bcd7ff">LINT IT. THEN BENCH IT.</text>
    </g>

    <text x="72" y="164" font-size="61" font-weight="760" letter-spacing="-2" fill="#f7fbff">Agent Context Bench</text>
    <text x="72" y="211" font-size="24" fill="#b9c9dc">Find whether AGENTS.md helps—or slows down—your coding agent.</text>

    <g transform="translate(72 256)" filter="url(#shadow)">
      <rect width="548" height="178" rx="18" fill="#0f2038" stroke="#2b4b70"/>
      <rect x="22" y="22" width="42" height="42" rx="11" fill="#163d6c"/>
      <path d="M34 35h18M34 43h13M34 51h16" stroke="#72adff" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="43" font-size="20" font-weight="750" fill="#f7fbff">Static audit</text>
      <text x="80" y="64" font-size="13" font-weight="700" letter-spacing=".8" fill="#55d6be">NO LLM / API CALLS</text>
      <text x="24" y="104" font-size="16" fill="#b9c9dc">Bloat • conflicts • duplicate rules • stale paths</text>
      <text x="24" y="135" font-size="16" fill="#b9c9dc">AGENTS.md • CLAUDE.md • SKILL.md • Cursor • Copilot</text>
      <text x="24" y="160" font-size="13" fill="#8197b1">Fast heuristic signals for every pull request</text>
    </g>

    <g transform="translate(660 256)" filter="url(#shadow)">
      <rect width="548" height="178" rx="18" fill="#0f2038" stroke="#2b4b70"/>
      <rect x="22" y="22" width="42" height="42" rx="11" fill="#163d6c"/>
      <path d="M34 50V38m9 12V31m9 19V41" stroke="#72adff" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="43" font-size="20" font-weight="750" fill="#f7fbff">Measured A/B benchmark</text>
      <text x="80" y="64" font-size="13" font-weight="700" letter-spacing=".8" fill="#55d6be">INVOKES YOUR AGENT CLI</text>
      <text x="24" y="104" font-size="16" fill="#b9c9dc">none  /  current  /  candidate context</text>
      <text x="24" y="135" font-size="16" fill="#b9c9dc">Success • wall time • token pressure • context P/R/F1</text>
      <text x="24" y="160" font-size="13" fill="#8197b1">Observed outcomes; provider usage and costs may apply</text>
    </g>

    <g transform="translate(72 478)">
      <rect width="1136" height="66" rx="14" fill="#071424" stroke="#2b4b70"/>
      <circle cx="28" cy="33" r="6" fill="#55d6be"/>
      <text x="48" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="19" fill="#e7f1ff">npx agent-context-bench@latest .</text>
      <text x="1108" y="40" text-anchor="end" font-size="14" font-weight="650" fill="#8fb5e5">MIT • Node 20+</text>
    </g>

    <text x="72" y="590" font-size="15" fill="#8fa4bd">Replicated demo result: bloated context added 58–69% wall time and 18–37% spend; success was inconclusive at n=4.</text>
  </g>
</svg>
