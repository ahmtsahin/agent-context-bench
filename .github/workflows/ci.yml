name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  dist:
    name: Checked-in dist is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated files are committed
        run: git diff --exit-code -- dist

  package-smoke:
    name: Packed package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install and exercise the published file set
        shell: bash
        run: |
          set -euo pipefail
          package_tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          smoke_dir="$RUNNER_TEMP/package-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          npm init --yes >/dev/null
          npm install "$RUNNER_TEMP/$package_tarball"
          test ! -d node_modules/gpt-tokenizer
          npx --no-install agent-context-bench --help >/dev/null
          node --input-type=module --eval \
            "const api = await import('agent-context-bench'); if (typeof api.analyzeRepo !== 'function') process.exit(1)"

  action-smoke:
    name: Local Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare an input-injection fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture='action-fixture"; touch action-input-injected; echo "'
          mkdir -p "$fixture"
          printf '%s\n' '# Agent context' '- Run npm test before finishing.' > "$fixture/AGENTS.md"
      - name: Exercise the composite Action
        id: bench
        uses: ./
        with:
          path: 'action-fixture"; touch action-input-injected; echo "'
          fail-under: "0"
          write-optimized: "true"
          comment: "false"
      - name: Verify Action outputs
        shell: bash
        env:
          REPORT_FILE: ${{ steps.bench.outputs.report-file }}
          OPTIMIZED_FILE: ${{ steps.bench.outputs.optimized-file }}
          OPTIMIZED_GENERATED: ${{ steps.bench.outputs.optimized-generated }}
        run: |
          set -euo pipefail
          test -s "$REPORT_FILE"
          test "$OPTIMIZED_GENERATED" = "true"
          test -s "$OPTIMIZED_FILE"
          test ! -e action-input-injected
