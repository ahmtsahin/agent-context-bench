name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate tag and package metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module --eval '
            import packageJson from "./package.json" with { type: "json" };
            import packageLock from "./package-lock.json" with { type: "json" };
            const expectedTag = `v${packageJson.version}`;
            const expectedRepository = `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
            if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG ?? "")) {
              throw new Error(`Release tag must be a stable semver tag: ${process.env.RELEASE_TAG}`);
            }
            if (process.env.RELEASE_TAG !== expectedTag) {
              throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${packageJson.version}`);
            }
            if (packageJson.repository?.url !== expectedRepository) {
              throw new Error(`package.json repository.url must be ${expectedRepository}`);
            }
            if (packageLock.version !== packageJson.version || packageLock.packages?.[""]?.version !== packageJson.version) {
              throw new Error("package-lock.json version does not match package.json");
            }
          '
      - run: npm ci
      - run: npm run check
      - name: Verify the release worktree is reproducible
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$worktree_status" ]; then
            echo "::error::Build or install steps left untracked release files."
            printf '%s\n' "$worktree_status"
            exit 1
          fi
      - name: Build exact release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          package_tarball="$(npm pack --ignore-scripts --pack-destination "$release_dir" --silent)"
          printf 'path=%s/%s\n' "$release_dir" "$package_tarball" >> "$GITHUB_OUTPUT"
      - name: Store verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish npm package and GitHub Release
    if: ${{ github.repository == 'ahmtsahin/agent-context-bench' }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/agent-context-bench
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify trusted-publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          NPM_VERSION="$npm_version" node --eval '
            const actual = process.env.NPM_VERSION.split(".").map(Number);
            const supported = actual[0] > 11
              || (actual[0] === 11 && actual[1] > 5)
              || (actual[0] === 11 && actual[1] === 5 && actual[2] >= 1);
            if (!supported) throw new Error(`npm >=11.5.1 is required for trusted publishing; found ${process.env.NPM_VERSION}`);
          '
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/release
      - name: Validate downloaded package
        id: artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_tarballs=("$RUNNER_TEMP/release"/*.tgz)
          if [ "${#package_tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one verified npm tarball; found ${#package_tarballs[@]}."
            exit 1
          fi

          package_tarball="${package_tarballs[0]}"
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

          tar -xOf "$package_tarball" package/package.json \
            | EXPECTED_NAME="$package_name" EXPECTED_VERSION="$package_version" node --eval '
                let source = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => { source += chunk; });
                process.stdin.on("end", () => {
                  const packed = JSON.parse(source);
                  if (packed.name !== process.env.EXPECTED_NAME || packed.version !== process.env.EXPECTED_VERSION) {
                    throw new Error(`Packed identity ${packed.name}@${packed.version} does not match the release checkout`);
                  }
                });
              '

          printf 'path=%s\n' "$package_tarball" >> "$GITHUB_OUTPUT"
      - name: Publish with npm trusted publishing
        shell: bash
        env:
          PACKAGE_TARBALL: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          published_version="$(npm view "$package_name@$package_version" version --silent 2>/dev/null || true)"

          if [ "$published_version" = "$package_version" ]; then
            published_integrity="$(npm view "$package_name@$package_version" dist.integrity --silent)"
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$PACKAGE_TARBALL" | openssl base64 -A)"
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "::error::$package_name@$package_version exists, but its registry integrity does not match the release artifact."
              exit 1
            fi
            echo "$package_name@$package_version already contains this exact artifact; skipping npm publish."
          else
            npm publish "$PACKAGE_TARBALL" --ignore-scripts --access public --provenance
          fi
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TARBALL: ${{ steps.artifact.outputs.path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_TARBALL#npm package" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_TARBALL#npm package" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
