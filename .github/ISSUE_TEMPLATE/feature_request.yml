name: Feature request
description: Propose a focused improvement to the audit, benchmark, Action, or API.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent-context decision is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior, including expected CLI or API shape when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Link public repositories, anonymized reports, or benchmark results that motivate the change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is about measuring or improving coding-agent context.
          required: true
        - label: I searched existing issues and roadmap items first.
          required: true
